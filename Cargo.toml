[package]
name = "blockhaven"
version = "0.1.0"
edition = "2021"
description = "Blockhaven: a procedurally generated voxel sandbox game with zero external assets"

[dependencies]
winit = "0.29"
wgpu = "0.19"
glam = "0.27"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
rodio = { version = "0.17", default-features = false }
gilrs = "0.10"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[profile.release]
opt-level = 3
debug = false
codegen-units = 4
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
